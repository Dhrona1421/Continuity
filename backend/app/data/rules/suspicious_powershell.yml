title: Suspicious Encoded PowerShell Execution
id: GS-SIGMA-001
status: stable
description: Detects PowerShell execution with encoded or download-oriented command content.
author: GhostSOC
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    process|endswith:
      - powershell.exe
      - pwsh.exe
  selection_flags:
    command_line|contains:
      - "-enc"
      - "-encodedcommand"
      - "downloadstring"
      - "invoke-webrequest"
  condition: selection_image and selection_flags
falsepositives:
  - Authorized administration scripts
level: high
tags:
  - attack.execution
  - attack.t1059.001
ghostsoc:
  confidence: 0.92
