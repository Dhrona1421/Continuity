name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock '.[test]'
      - name: Ruff
        run: ruff check app tests alembic/versions
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Dependency audit
        if: matrix.python-version == '3.13'
        run: pip install pip-audit && pip-audit -r requirements.lock

  frontend:
    name: Frontend Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  compose-contract:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install pyyaml pytest
      - run: python -m pytest backend/tests/test_compose_contract.py -q

  release-hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked local artifacts
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env$|.*\.(db|sqlite|sqlite3|pyc))$|(^|/)(node_modules|__pycache__|\.pytest_cache)/' || true)
          if [ -n "$bad" ]; then
            echo "Release artifacts must not be tracked:"
            echo "$bad"
            exit 1
          fi
      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' \
            'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}' .; then
            echo 'Potential secret detected.'
            exit 1
          fi
